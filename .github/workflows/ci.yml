name: CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Testleri Calistir
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Singleton Testlerini Calistir
        run: pytest test_model_singleton.py -v

      - name: Repository Testlerini Calistir
        run: pytest test_repository.py -v

      - name: API Testlerini Calistir
        run: pytest test_api.py -v

  deploy:
    name: Render Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Render Deploy Tetikle
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

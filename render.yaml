services:
  - type: web
    name: afet-projesi
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app api.py db upgrade
    startCommand: gunicorn api:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
